[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custos"
version = "0.1.0"
description = "Controlled infrastructure access"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "SQLAlchemy>=2.0,<3", "ldap3>=2.9.1,<3", "Flask>=3.1,<4", "cryptography>=44", "pyvmomi>=8.0.3", "dnspython>=2.6,<3", "regex>=2024.11.6", "Markdown>=3.7,<4"]

[project.scripts]
custos = "custos.cli:main"
custos-directory = "custos.directory_cli:main"
custos-worker = "custos.worker:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
console = ["starlette>=0.47,<1", "uvicorn[standard]>=0.35,<1", "websockets>=15,<16"]

[tool.setuptools.packages.find]
where = ["src"]
