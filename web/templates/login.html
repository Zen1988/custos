<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Custos — Sign in</title></head>
<body><main><h1>Sign in to Custos</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login', directory_id=directory_id) if directory_id else url_for('login') }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p><label for="username">{{ 'Directory username or UPN' if directory_id else 'Local username' }}</label><input id="username" name="username" autocomplete="username" required maxlength="200"></p>
  <p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"></p>
  <button id="login-submit" type="submit">Sign in</button>
</form></main></body></html>
